# 发布到 PyPI（Trusted Publisher，免 API token）
#
# 触发方式：
#   1. 在 GitHub 上发布一个 Release（推荐）：自动构建并上传 sdist + wheel
#   2. 手动触发（Actions 页面 Run workflow）
#
# 前提（一次性配置，在 PyPI 账号 Publishing 页完成）：
#   PyPI Project Name: llm-with-vim
#   Owner: Kenneth-Lee   Repository: llm_with_vim   Workflow: publish.yml
#
# 发布流程：bump llm_engine/__init__.py 的 __version__ → 提交并推送 →
# 打 tag（如 v2.0.20260411）→ GitHub 上基于该 tag 创建 Release → 自动发布。
# 注意：PyPI 同版本号不可重传，每次发布前必须改版本号。

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Trusted Publisher 的 OIDC 凭证
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
